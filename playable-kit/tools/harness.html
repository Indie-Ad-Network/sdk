<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>A playable in indie-ads' player</title>
<style>html, body { margin: 0; height: 100%; background: #223; color: #fff; font: 15px system-ui, sans-serif; } #out { padding: 16px; white-space: pre-wrap; } button { font: inherit; padding: 10px 16px; margin: 16px; }</style>
</head><body>
<button id="again">Show the ad</button><div id="out">The host game would be here.</div>
<script type="module">
// The page given to tools/serve.mjs, played by indie-ads' real player (core/player.js) as the admin's
// creative record would have it:  ?secs=30  ?finishEarly=1  ?keepPlaying=1  ?ownCard=1 (it has an end card of its own)  ?report=1 (the ⓘ takes a report)  ?least=5 (the game's least time for the placement, in seconds)  ?skipFrom=5 (the earliest it may be left)  ?muted=1  ?format=interstitial  ?lang=fr  ?more=1 (the ⓘ's link to more games)
// ?wait=1 shows nothing until the button is pressed, so the page may have sound (a browser wants a touch first).
// What the player emits is in window.__events, and what show() resolved to in window.__result.
import { play } from '/indie-ads/core/player.js';
import { stringsFor } from '/indie-ads/core/locale.js';
const q = new URLSearchParams(location.search), out = document.getElementById('out');
window.__events = []; window.__result = null;
async function show() {
  window.__events.length = 0; window.__result = null;
  const html = await (await fetch('/playable.html')).text();
  const result = await play({
    creative: { kind: 'playable', secs: +q.get('secs') || 30, finishEarly: q.has('finishEarly'), keepPlaying: q.has('keepPlaying'), ownCard: q.has('ownCard'), ...(q.has('skipFrom') && { skipFrom: +q.get('skipFrom') }), line: 'The line for the end card.' },
    app: { name: q.get('name') || 'The game advertised', line: 'Its one line.', studio: 'Its studio' },
    html, link: { via: 'harness' }, ctaText: 'Get', reward: '+3 hints', format: q.get('format') || 'rewarded', muted: q.has('muted'), least: q.has('least') ? +q.get('least') : null,
    emit: (event, fields) => { window.__events.push([event, fields || {}]); out.textContent = window.__events.map(e => e[0] + ' ' + JSON.stringify(e[1])).join('\n'); },
    openStore: async () => { window.__events.push(['(store opened)', {}]); }, words: stringsFor(q.get('lang') || 'en'),
    report: q.has('report') ? r => { window.__events.push(['(reported)', r]); } : null,
    more: q.has('more') ? () => { window.__events.push(['(more games opened)', {}]); } : null,
  });
  window.__result = result; out.textContent += '\nclosed: ' + JSON.stringify(result);
}
document.getElementById('again').onclick = show;
if (!q.has('wait')) show();
</script>
</body></html>
