:host { all: initial; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; }
.layer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; color: #fff; font: 600 15px/1.3 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.bar { direction: ltr; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left)); z-index: 3; }
.video .bar, .card .bar { position: absolute; top: 0; left: 0; right: 0; background: none; }
.playable .bar { background: #10202f; }
@media (orientation: landscape) {   /* a screen wider than tall has the least to give in height, and a solid bar across it takes of that: it lies over the playable's top, which a playable keeps clear, and what's between its buttons is the playable's to touch */
  .playable .bar { position: absolute; top: 0; left: 0; right: 0; padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 14px; background: none; pointer-events: none; }
  .playable .bar button { pointer-events: auto; }
}
.bar-space { flex: 1; }
.about { flex: none; display: flex; align-items: center; gap: ${z.aboutGap}px; height: ${z.size}px; margin: 0 -4px; padding: 0 4px; border: 0; background: none; color: rgb(${Math.round(z.aboutTextGrey*255)},${Math.round(z.aboutTextGrey*255)},${Math.round(z.aboutTextGrey*255)}); text-shadow: none; }
.about i { position: relative; isolation: isolate; display: flex; align-items: center; height: ${z.aboutSize}px; padding: 0 ${z.tagPadding}px; font: 900 ${z.adSize}px/1 "IndieAdsCairoBlack", system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
/* Match the internal SDK's sliced label corners without stretching its outline. */
.about i::before { content: ""; position: absolute; z-index: -1; top: 0; right: 0; bottom: 0; left: 0; border: ${z.tagBorder}px solid transparent; border-image: url("${Qt}") ${z.tagSlice} fill / ${z.tagBorder}px; pointer-events: none; }
.about b { display: flex; align-items: center; justify-content: center; width: ${z.aboutSize}px; height: ${z.aboutSize}px; background: url("${tg}") center / 100% 100% no-repeat; }
.about b span { font: italic 700 ${z.infoSize}px/1 Georgia, "Times New Roman", serif; text-align: center; }
.ring { position: relative; width: ${z.size}px; height: ${z.size}px; flex: none; padding: 0; border: 0; background: url("${tg}") center / ${z.timerBackgroundSize}px ${z.timerBackgroundSize}px no-repeat; color: inherit; }
.ring > svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke: #fff; stroke-width: ${z.stroke}; }
.ring .left { fill: none; stroke: #fff; stroke-linecap: round; stroke-dasharray: ${Et}; transition: stroke-dashoffset ${Mt}ms linear; }
.ring.skippable b, .ring.closable b { background: center / ${z.iconSize}px ${z.iconSize}px no-repeat; }
.ring.skippable b { background-image: url("${wt}"); }
.ring.closable b { background-image: url("${at}"); }
.ring.closable .left { stroke-dashoffset: 0 !important; }
.ring.closable b { font-size: 22px; }
.ring b { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; font: 900 ${z.numberSize}px/1 "IndieAdsCairoBlack", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.get { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px; border: 0; border-radius: 999px; background: #1f6fd6; color: #fff; font-weight: 900; font-size: 15px; line-height: 1; white-space: nowrap; box-shadow: 0 2px 8px #0006; }
